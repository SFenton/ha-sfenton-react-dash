services:
  home-mcp:
    build:
      context: ..
      dockerfile: home-mcp/Dockerfile
    image: sfenton-home-mcp:local
    container_name: sfenton-home-mcp
    restart: unless-stopped
    environment:
      HOME_MCP_HOST: 0.0.0.0
      HOME_MCP_PORT: 8787
      HOME_MCP_HA_URL: ${HOME_MCP_HA_URL:-https://homeassistant.sfenton-server.com}
      HOME_MCP_AGENT_ID: ${HOME_MCP_AGENT_ID:-conversation.google_ai_conversation}
      HOME_MCP_CHAT_MODEL: ${HOME_MCP_CHAT_MODEL:-Gemini 3.1 Flash Lite}
      HOME_MCP_ALLOWED_ORIGINS: ${HOME_MCP_ALLOWED_ORIGINS:-}
      HOME_MCP_IMPROVEMENT_ENABLED: "false"
      HOME_MCP_AUTO_PUBLISH: "false"
      HOME_MCP_IMPROVEMENT_QUIET_MS: ${HOME_MCP_IMPROVEMENT_QUIET_MS:-300000}
    ports:
      - "127.0.0.1:8787:8787"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
