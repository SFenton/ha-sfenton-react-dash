services:
  home-mcp:
    build:
      context: ./source
      dockerfile: home-mcp/Dockerfile
    image: sfenton-home-mcp:local
    container_name: sfenton-home-mcp
    restart: unless-stopped
    environment:
      HOME_MCP_HOST: 0.0.0.0
      HOME_MCP_PORT: 8787
      HOME_MCP_HA_URL: ${HOME_MCP_HA_URL:-https://homeassistant.sfenton-server.com}
      HOME_MCP_ALLOWED_ORIGINS: ${HOME_MCP_ALLOWED_ORIGINS:-https://homeassistant.sfenton-server.com,http://homeassistant.local:8123,http://192.168.1.22:8123}
      HOME_MCP_TLS_CERT: /tls/server.crt
      HOME_MCP_TLS_KEY: /tls/server.key
    ports:
      - "192.168.1.155:8787:8787"
    volumes:
      - ./tls:/tls:ro
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:8787,path:'/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
