                              'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                              'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                              'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                              'wake_source_ref': current_journal.get('wake_source_ref'),
                              'wake_owner_ref': current_journal.get('wake_owner_ref'),
                              'wake_prior_state': current_journal.get('wake_prior_state'),
                              'presence_evidence': presence_evidence,
                              'pending_request': none,
                              'restore_record': {'reason': 'interrupted_transition'},
                              'request_results': journal_request_results
                            }) }}
                          interrupted_status_payload: >-
                            {{ {
                              'contract_version': 1,
                              'revision': current_revision,
                              'command_available': true,
                              'mode': 'solo_trip',
                              'traveler': selected_traveler,
                              'home_resident': home_resident,
                              'starts_at': journal_plan.starts_at if journal_plan is mapping else none,
                              'ends_at': journal_plan.ends_at if journal_plan is mapping else none,
                              'blockers': ['interrupted_transition'],
                              'effects': interrupted_effects,
                              'restore_required': true,
                              'release_token': current_release_token,
                              'state': 'restore_required'
                            } | to_json(sort_keys=true) }}
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ interrupted_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (interrupted_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (interrupted_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision, 'state': 'restore_required', 'error_code': 'journal_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}"
                              - stop: Interrupted transition journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ interrupted_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (interrupted_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (interrupted_status_payload | from_json).release_token and states('sensor.household_away_status') == 'restore_required' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision, 'state': 'restore_required', 'error_code': 'status_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}"
                              - stop: Interrupted transition status echo timed out
                                response_variable: household_away_response
                      - variables:
                          household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision, 'state': 'restore_required', 'error_code': 'interrupted_transition', 'retryable': false, 'confirmed_effects': []} }}"
                      - stop: Interrupted transition requires restore
                        response_variable: household_away_response

                  - conditions: "{{ journal_phase == 'scheduled' and is_state('input_boolean.solo_trip_enabled', 'on') and plan_start_timestamp is number and plan_end_timestamp is number and now_timestamp >= plan_start_timestamp and now_timestamp < plan_end_timestamp }}"
                    sequence:
                      - choose:
                          - conditions: "{{ not current_schedule_ready }}"
                            sequence:
                              - variables:
                                  household_away_response: >-
                                    {{ dict(default_response, error_code='schedule_unavailable', retryable=true) }}
                              - stop: SleepyPod schedule is not ready for activation
                                response_variable: household_away_response
                      - variables:
                          activation_release_token: "{{ 'release-v1-r' ~ (current_revision + 1) }}"
                          activation_owner_ref: "{{ 'solo_trip:' ~ normalized_request_id }}"
                          activation_pending_response: >-
                            {{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision + 1, 'state': 'restore_required', 'error_code': 'journal_claim_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}
                          activation_claim_pending_request: >-
                            {% from 'solo_trip.jinja' import pending_request_record %}
                            {{ pending_request_record(normalized_request_id, request_hash_value, 'reconcile', current_revision + 1, activation_release_token, 'activating', activation_pending_response) }}
                          activation_claim_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 1,
                              'revision': current_revision + 1,
                              'solo_phase': 'activating',
                              'writer_owner': activation_owner_ref,
                              'release_token': activation_release_token,
                              'runtime_plan': journal_plan,
                              'sleepypod_baseline': none,
                              'baseline_fingerprint': none,
                              'last_confirmed_overlay_fingerprint': none,
                              'wake_source_ref': 'sleepypod:' ~ away_side,
                              'wake_owner_ref': activation_owner_ref,
                              'wake_prior_state': states(wake_light_entity_id),
                              'presence_evidence': presence_evidence,
                              'pending_request': activation_claim_pending_request | from_json,
                              'restore_record': none,
                              'request_results': journal_request_results
                            }) }}
                          activating_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'solo_trip', 'traveler': selected_traveler, 'home_resident': home_resident, 'starts_at': journal_plan.starts_at, 'ends_at': journal_plan.ends_at, 'blockers': [], 'effects': {'sleepypod_live_follow': false, 'sleepypod_schedule': false, 'wake_light_source': false}, 'restore_required': false, 'release_token': activation_release_token, 'state': 'activating'} | to_json(sort_keys=true) }}
                          baseline_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 2,
                              'revision': current_revision + 1,
                              'solo_phase': 'activating',
                              'writer_owner': activation_owner_ref,
                              'release_token': activation_release_token,
                              'runtime_plan': dict(journal_plan, started_at=now().isoformat()),
                              'sleepypod_baseline': current_schedule_payload[away_side],
                              'baseline_fingerprint': current_away_fingerprint,
                              'last_confirmed_overlay_fingerprint': none,
                              'wake_source_ref': 'sleepypod:' ~ away_side,
                              'wake_owner_ref': activation_owner_ref,
                              'wake_prior_state': states(wake_light_entity_id),
                              'presence_evidence': {'entity_id': traveler_person_entity_id, 'observed_at': now().isoformat(), 'observed_state': traveler_state, 'post_start_away': traveler_state not in ['home', 'unknown', 'unavailable']},
                              'pending_request': activation_claim_pending_request | from_json,
                              'restore_record': none,
                              'request_results': journal_request_results
                            }) }}
                          mirrored_schedule_payload: >-
                            {% from 'solo_trip.jinja' import merged_schedule %}
                            {{ merged_schedule(current_schedule_payload, current_schedule_payload[home_side], home_side, true, home_side, away_side) }}
                          mirrored_schedule_map: >-
                            {{ mirrored_schedule_payload
                               if mirrored_schedule_payload is mapping
                               else mirrored_schedule_payload | from_json }}
                          mirrored_schedule_json: >-
                            {{ mirrored_schedule_payload | to_json(sort_keys=true)
                               if mirrored_schedule_payload is mapping
                               else mirrored_schedule_payload }}
                          mirrored_away_fingerprint: >-
                            {% from 'solo_trip.jinja' import side_fingerprint %}
                            {{ side_fingerprint(mirrored_schedule_map[away_side]) }}
                          mirrored_full_schedule_fingerprint: >-
                            {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                            {{ full_schedule_fingerprint(mirrored_schedule_map) }}
                          active_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 3,
                              'revision': current_revision + 1,
                              'solo_phase': 'active',
                              'writer_owner': activation_owner_ref,
                              'release_token': activation_release_token,
                              'runtime_plan': dict(journal_plan, started_at=now().isoformat()),
                              'sleepypod_baseline': current_schedule_payload[away_side],
                              'baseline_fingerprint': current_away_fingerprint,
                              'last_confirmed_overlay_fingerprint': mirrored_away_fingerprint,
                              'wake_source_ref': 'sleepypod:' ~ away_side,
                              'wake_owner_ref': activation_owner_ref,
                              'wake_prior_state': states(wake_light_entity_id),
                              'presence_evidence': {'entity_id': traveler_person_entity_id, 'observed_at': now().isoformat(), 'observed_state': traveler_state, 'post_start_away': traveler_state not in ['home', 'unknown', 'unavailable']},
                              'pending_request': none,
                              'restore_record': none,
                              'request_results': journal_request_results
                            }) }}
                          active_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'solo_trip', 'traveler': selected_traveler, 'home_resident': home_resident, 'starts_at': journal_plan.starts_at, 'ends_at': journal_plan.ends_at, 'blockers': [], 'effects': {'sleepypod_live_follow': true, 'sleepypod_schedule': true, 'wake_light_source': true}, 'restore_required': false, 'release_token': activation_release_token, 'state': 'active'} | to_json(sort_keys=true) }}
                          restore_required_activation_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 4,
                              'revision': current_revision + 1,
                              'solo_phase': 'restore_required',
                              'writer_owner': activation_owner_ref,
                              'release_token': activation_release_token,
                              'runtime_plan': dict(journal_plan, started_at=now().isoformat()),
                              'sleepypod_baseline': current_schedule_payload[away_side],
                              'baseline_fingerprint': current_away_fingerprint,
                              'last_confirmed_overlay_fingerprint': none,
                              'wake_source_ref': 'sleepypod:' ~ away_side,
                              'wake_owner_ref': activation_owner_ref,
                              'wake_prior_state': states(wake_light_entity_id),
                              'presence_evidence': {'entity_id': traveler_person_entity_id, 'observed_at': now().isoformat(), 'observed_state': traveler_state, 'post_start_away': traveler_state not in ['home', 'unknown', 'unavailable']},
                              'pending_request': none,
                              'restore_record': {'reason': 'activation_incomplete'},
                              'request_results': journal_request_results
                            }) }}
                          restore_required_activation_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'solo_trip', 'traveler': selected_traveler, 'home_resident': home_resident, 'starts_at': journal_plan.starts_at, 'ends_at': journal_plan.ends_at, 'blockers': ['activation_incomplete'], 'effects': {'sleepypod_live_follow': false, 'sleepypod_schedule': false, 'wake_light_source': false}, 'restore_required': true, 'release_token': activation_release_token, 'state': 'restore_required'} | to_json(sort_keys=true) }}
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ activation_claim_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (activation_claim_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (activation_claim_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ activation_pending_response }}"
                              - stop: Claim journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ activating_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (activating_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (activating_status_payload | from_json).release_token and states('sensor.household_away_status') == 'activating' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='status_echo_timeout') }}"
                              - stop: Activating status echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ baseline_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (baseline_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (baseline_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='journal_baseline_echo_timeout') }}"
                              - stop: Baseline journal echo timed out
                                response_variable: household_away_response
                      - choose:
                          - conditions: >-
                              {% from 'solo_trip.jinja' import side_fingerprint %}
                              {{ side_fingerprint(state_attr(sleepypod_schedule_entity_id, away_side))
                                 != current_away_fingerprint }}
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='restore_required_due_to_divergence') }}"
                              - stop: SleepyPod baseline diverged before effects
                                response_variable: household_away_response
                      - action: wake_light.command
                        data:
                          profile_id: "{{ wake_light_profile_id }}"
                          expected_revision: "{{ wake_current_revision }}"
                          request_id: "{{ normalized_request_id }}"
                          operation: set_source_suspension
                          source_ref: "{{ 'sleepypod:' ~ away_side }}"
                          suspended: true
                          owner_ref: "{{ activation_owner_ref }}"
                        response_variable: wake_light_response
                      - choose:
                          - conditions: "{{ wake_light_response.outcome not in ['accepted', 'no_change'] }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='wake_light_rejected') }}"
                              - stop: Wake Light rejected activation
                                response_variable: household_away_response
                      - choose:
                          - conditions: "{{ states(selected_profile.away_alarm_state) in ['ringing', 'snoozed'] }}"
                            sequence:
                              - action: button.press
                                target:
                                  entity_id: "{{ selected_profile.away_alarm_stop }}"
                              - wait_template: >-
                                  {{ states(selected_profile.away_alarm_state) not in ['ringing', 'snoozed'] }}
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - choose:
                                  - conditions: "{{ not wait.completed }}"
                                    sequence:
                                      - action: mqtt.publish
                                        data:
                                          topic: "{{ solo_topic_journal }}"
                                          payload: "{{ restore_required_activation_payload }}"
                                          qos: 1
                                          retain: true
                                      - action: mqtt.publish
                                        data:
                                          topic: "{{ solo_topic_status }}"
                                          payload: "{{ restore_required_activation_status_payload }}"
                                          qos: 1
                                          retain: true
                                      - variables:
                                          household_away_response: "{{ dict(activation_pending_response, error_code='away_alarm_clear_timeout') }}"
                                      - stop: Away alarm did not clear
                                        response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ sleepypod_topic_schedule }}"
                          payload: "{{ mirrored_schedule_json }}"
                          qos: 1
                          retain: false
                      - wait_template: >-
                          {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                          {{ full_schedule_fingerprint({
                            'left': state_attr(sleepypod_schedule_entity_id, 'left') | default({}, true),
                            'right': state_attr(sleepypod_schedule_entity_id, 'right') | default({}, true)
                          }) == mirrored_full_schedule_fingerprint }}
                        timeout: "00:02:00"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='schedule_echo_timeout') }}"
                              - stop: Activation schedule echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ active_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (active_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (active_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='journal_echo_timeout') }}"
                              - stop: Active journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ active_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (active_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (active_status_payload | from_json).release_token and states('sensor.household_away_status') == 'active' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_activation_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_activation_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(activation_pending_response, error_code='status_echo_timeout') }}"
                              - stop: Active status echo timed out
                                response_variable: household_away_response
                      - variables:
                          household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision + 1, 'state': 'active', 'error_code': none, 'retryable': false, 'confirmed_effects': ['writer_claimed', 'wake_light_source', 'sleepypod_schedule']} }}"
                      - stop: Solo Trip activated
                        response_variable: household_away_response

                  - conditions: >-
                      {% from 'solo_trip.jinja' import side_fingerprint %}
                      {{ journal_phase == 'active'
                         and (
                           current_journal.get('last_confirmed_overlay_fingerprint') is not string
                           or side_fingerprint(current_schedule_payload[away_side])
                             != current_journal.get('last_confirmed_overlay_fingerprint')
                         ) }}
                    sequence:
                      - variables:
                          active_divergence_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 1,
                              'revision': current_revision + 1,
                              'solo_phase': 'restore_required',
                              'writer_owner': journal_owner,
                              'release_token': current_release_token,
                              'runtime_plan': journal_plan,
                              'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                              'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                              'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                              'wake_source_ref': current_journal.get('wake_source_ref'),
                              'wake_owner_ref': current_journal.get('wake_owner_ref'),
                              'wake_prior_state': current_journal.get('wake_prior_state'),
                              'presence_evidence': presence_evidence,
                              'pending_request': none,
                              'restore_record': {
                                'reason': 'sleepypod_schedule_diverged',
                                'observed_away_side': current_schedule_payload[away_side],
                                'observed_fingerprint': current_away_fingerprint
                              },
                              'request_results': journal_request_results
                            }) }}
                          active_divergence_status_payload: >-
                            {{ {
                              'contract_version': 1,
                              'revision': current_revision + 1,
                              'command_available': true,
                              'mode': 'solo_trip',
                              'traveler': selected_traveler,
                              'home_resident': home_resident,
                              'starts_at': journal_plan.starts_at,
                              'ends_at': journal_plan.ends_at,
                              'blockers': ['sleepypod_schedule_diverged'],
                              'effects': {
                                'sleepypod_live_follow': false,
                                'sleepypod_schedule': false,
                                'wake_light_source': true
                              },
                              'restore_required': true,
                              'release_token': current_release_token,
                              'state': 'restore_required'
                            } | to_json(sort_keys=true) }}
                          active_divergence_response: >-
                            {{ {
                              'request_id': normalized_request_id,
                              'status': 'indeterminate',
                              'revision': current_revision + 1,
                              'state': 'restore_required',
                              'error_code': 'restore_required_due_to_divergence',
                              'retryable': false,
                              'confirmed_effects': ['wake_light_source']
                            } }}
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ active_divergence_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (active_divergence_journal_payload | from_json).generation
                             and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (active_divergence_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(active_divergence_response, error_code='journal_echo_timeout', retryable=true) }}"
                              - stop: Active divergence journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ active_divergence_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (active_divergence_status_payload | from_json).revision
                             and state_attr('sensor.household_away_status', 'release_token') == (active_divergence_status_payload | from_json).release_token
                             and states('sensor.household_away_status') == 'restore_required' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(active_divergence_response, error_code='status_echo_timeout', retryable=true) }}"
                              - stop: Active divergence status echo timed out
                                response_variable: household_away_response
                      - variables:
                          household_away_response: "{{ active_divergence_response }}"
                      - stop: Active SleepyPod schedule diverged
                        response_variable: household_away_response

                  - conditions: "{{ journal_phase == 'active' and traveler_state not in ['home', 'unknown', 'unavailable'] and not (presence_evidence.post_start_away | default(false)) }}"
                    sequence:
                      - variables:
                          evidence_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 1,
                              'revision': current_revision,
                              'solo_phase': 'active',
                              'writer_owner': journal_owner,
                              'release_token': current_release_token,
                              'runtime_plan': journal_plan,
                              'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                              'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                              'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                              'wake_source_ref': current_journal.get('wake_source_ref'),
                              'wake_owner_ref': current_journal.get('wake_owner_ref'),
                              'wake_prior_state': current_journal.get('wake_prior_state'),
                              'presence_evidence': {'entity_id': traveler_person_entity_id, 'observed_at': now().isoformat(), 'observed_state': traveler_state, 'post_start_away': true},
                              'pending_request': none,
                              'restore_record': none,
                              'request_results': journal_request_results
                            }) }}
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ evidence_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (evidence_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (evidence_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision, 'state': 'active', 'error_code': 'journal_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}"
                              - stop: Presence evidence journal echo timed out
                                response_variable: household_away_response
                      - variables:
                          household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision, 'state': 'active', 'error_code': none, 'retryable': false, 'confirmed_effects': []} }}"
                      - stop: Presence evidence updated
                        response_variable: household_away_response

                  - conditions: >-
                      {{ journal_phase in ['active', 'restore_required']
                         and (
                           is_state('input_boolean.solo_trip_enabled', 'off')
                           or is_state('input_boolean.vacation_mode', 'on')
                           or (plan_end_timestamp is number and now_timestamp >= plan_end_timestamp)
                           or (
                             traveler_state == 'home'
                             and presence_evidence is mapping
                             and presence_evidence.post_start_away | default(false)
                           )
                         ) }}
                    sequence:
                      - variables:
                          ending_reason: >-
                            {% if is_state('input_boolean.solo_trip_enabled', 'off') %}
                              explicit_end_now
                            {% elif is_state('input_boolean.vacation_mode', 'on') %}
                              vacation_mode_requested
                            {% elif plan_end_timestamp is number and now_timestamp >= plan_end_timestamp %}
                              scheduled_end
                            {% else %}
                              traveler_returned
                            {% endif %}
                          final_end_release_token: "{{ 'release-v1-r' ~ (current_revision + 1) }}"
                          final_end_pending_response: >-
                            {{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision + 1, 'state': 'restore_required', 'error_code': 'status_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}
                          ending_pending_request: >-
                            {% from 'solo_trip.jinja' import pending_request_record %}
                            {{ pending_request_record(normalized_request_id, request_hash_value, 'end_now', current_revision + 1, current_release_token, 'ending', final_end_pending_response) }}
                          ending_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 1,
                              'revision': current_revision + 1,
                              'solo_phase': 'ending',
                              'writer_owner': journal_owner,
                              'release_token': current_release_token,
                              'runtime_plan': journal_plan,
                              'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                              'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                              'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                              'wake_source_ref': current_journal.get('wake_source_ref'),
                              'wake_owner_ref': current_journal.get('wake_owner_ref'),
                              'wake_prior_state': current_journal.get('wake_prior_state'),
                              'presence_evidence': presence_evidence,
                              'pending_request': ending_pending_request | from_json,
                              'restore_record': none,
                              'request_results': journal_request_results
                            }) }}
                          ending_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'solo_trip', 'traveler': selected_traveler, 'home_resident': home_resident, 'starts_at': journal_plan.starts_at, 'ends_at': journal_plan.ends_at, 'blockers': [], 'effects': {'sleepypod_live_follow': true, 'sleepypod_schedule': true, 'wake_light_source': true}, 'restore_required': false, 'release_token': current_release_token, 'state': 'ending'} | to_json(sort_keys=true) }}
                          restore_required_end_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 2,
                              'revision': current_revision + 1,
                              'solo_phase': 'restore_required',
                              'writer_owner': journal_owner,
                              'release_token': current_release_token,
                              'runtime_plan': journal_plan,
                              'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                              'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                              'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                              'wake_source_ref': current_journal.get('wake_source_ref'),
                              'wake_owner_ref': current_journal.get('wake_owner_ref'),
                              'wake_prior_state': current_journal.get('wake_prior_state'),
                              'presence_evidence': presence_evidence,
                              'pending_request': ending_pending_request | from_json,
                              'restore_record': {'reason': 'sleepypod_schedule_diverged'},
                              'request_results': journal_request_results
                            }) }}
                          restore_required_end_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'solo_trip', 'traveler': selected_traveler, 'home_resident': home_resident, 'starts_at': journal_plan.starts_at, 'ends_at': journal_plan.ends_at, 'blockers': ['sleepypod_schedule_diverged'], 'effects': {'sleepypod_live_follow': false, 'sleepypod_schedule': false, 'wake_light_source': true}, 'restore_required': true, 'release_token': current_release_token, 'state': 'restore_required'} | to_json(sort_keys=true) }}
                          restored_schedule_payload: >-
                            {% from 'solo_trip.jinja' import restored_schedule %}
                            {{ restored_schedule(current_schedule_payload, current_journal.get('sleepypod_baseline', {}), away_side) }}
                          restored_schedule_map: >-
                            {{ restored_schedule_payload
                               if restored_schedule_payload is mapping
                               else restored_schedule_payload | from_json }}
                          restored_schedule_json: >-
                            {{ restored_schedule_payload | to_json(sort_keys=true)
                               if restored_schedule_payload is mapping
                               else restored_schedule_payload }}
                          restored_full_schedule_fingerprint: >-
                            {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                            {{ full_schedule_fingerprint(restored_schedule_map) }}
                          final_end_terminal_response: >-
                            {{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision + 1, 'state': 'idle', 'error_code': none, 'retryable': false, 'confirmed_effects': ['sleepypod_schedule', 'wake_light_source', 'writer_released']} }}
                          final_end_terminal_request_results: >-
                            {{ journal_request_results | to_json(sort_keys=true) }}
                          final_end_terminal_journal_payload: >-
                            {% from 'solo_trip.jinja' import signed_journal %}
                            {{ signed_journal({
                              'schema_version': 1,
                              'canonicalization_version': 1,
                              'generation': current_generation + 2,
                              'revision': current_revision + 1,
                              'solo_phase': 'idle',
                              'writer_owner': none,
                              'release_token': final_end_release_token,
                              'runtime_plan': none,
                              'sleepypod_baseline': none,
                              'baseline_fingerprint': none,
                              'last_confirmed_overlay_fingerprint': none,
                              'wake_source_ref': none,
                              'wake_owner_ref': none,
                              'wake_prior_state': none,
                              'presence_evidence': {},
                              'pending_request': none,
                              'restore_record': none,
                              'request_results': final_end_terminal_request_results | from_json
                            }) }}
                          final_end_status_payload: >-
                            {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'none', 'traveler': 'none', 'home_resident': 'none', 'starts_at': none, 'ends_at': none, 'blockers': [], 'effects': {'sleepypod_live_follow': false, 'sleepypod_schedule': false, 'wake_light_source': false}, 'restore_required': false, 'release_token': final_end_release_token, 'state': 'idle'} | to_json(sort_keys=true) }}
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ ending_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (ending_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (ending_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, state='ending', error_code='journal_echo_timeout') }}"
                              - stop: Ending journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ ending_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (ending_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (ending_status_payload | from_json).release_token and states('sensor.household_away_status') == 'ending' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, state='ending', error_code='status_echo_timeout') }}"
                              - stop: Ending status echo timed out
                                response_variable: household_away_response
                      - choose:
                          - conditions: "{{ states(selected_profile.away_alarm_state) in ['ringing', 'snoozed'] }}"
                            sequence:
                              - action: button.press
                                target:
                                  entity_id: "{{ selected_profile.away_alarm_stop }}"
                              - wait_template: >-
                                  {{ states(selected_profile.away_alarm_state) not in ['ringing', 'snoozed'] }}
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - choose:
                                  - conditions: "{{ not wait.completed }}"
                                    sequence:
                                      - action: mqtt.publish
                                        data:
                                          topic: "{{ solo_topic_journal }}"
                                          payload: "{{ restore_required_end_journal_payload }}"
                                          qos: 1
                                          retain: true
                                      - action: mqtt.publish
                                        data:
                                          topic: "{{ solo_topic_status }}"
                                          payload: "{{ restore_required_end_status_payload }}"
                                          qos: 1
                                          retain: true
                                      - variables:
                                          household_away_response: "{{ dict(final_end_pending_response, error_code='away_alarm_clear_timeout') }}"
                                      - stop: Away alarm did not clear during end
                                        response_variable: household_away_response
                      - choose:
                          - conditions: "{{ current_away_fingerprint != current_journal.get('last_confirmed_overlay_fingerprint') }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_end_journal_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_end_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, error_code='restore_required_due_to_divergence') }}"
                              - stop: Schedule divergence requires restore resolution
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ sleepypod_topic_schedule }}"
                          payload: "{{ restored_schedule_json }}"
                          qos: 1
                          retain: false
                      - wait_template: >-
                          {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                          {{ full_schedule_fingerprint({
                            'left': state_attr(sleepypod_schedule_entity_id, 'left') | default({}, true),
                            'right': state_attr(sleepypod_schedule_entity_id, 'right') | default({}, true)
                          }) == restored_full_schedule_fingerprint }}
                        timeout: "00:02:00"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_end_journal_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_end_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, error_code='schedule_echo_timeout') }}"
                              - stop: Restore schedule echo timed out
                                response_variable: household_away_response
                      - action: wake_light.command
                        data:
                          profile_id: "{{ wake_light_profile_id }}"
                          expected_revision: "{{ wake_current_revision }}"
                          request_id: "{{ normalized_request_id }}"
                          operation: set_source_suspension
                          source_ref: "{{ current_journal.get('wake_source_ref') }}"
                          suspended: false
                          owner_ref: "{{ current_journal.get('wake_owner_ref') }}"
                        response_variable: wake_light_response
                      - choose:
                          - conditions: "{{ wake_light_response.outcome not in ['accepted', 'no_change'] }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ restore_required_end_journal_payload }}"
                                  qos: 1
                                  retain: true
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ restore_required_end_status_payload }}"
                                  qos: 1
                                  retain: true
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, error_code='wake_light_rejected') }}"
                              - stop: Wake Light release was rejected
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ final_end_terminal_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (final_end_terminal_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (final_end_terminal_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, error_code='journal_echo_timeout') }}"
                              - stop: Final end journal echo timed out
                                response_variable: household_away_response
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_status }}"
                          payload: "{{ final_end_status_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (final_end_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (final_end_status_payload | from_json).release_token and states('sensor.household_away_status') == 'idle' }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(final_end_pending_response, error_code='status_echo_timeout') }}"
                              - stop: Final end status echo timed out
                                response_variable: household_away_response
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.solo_trip_enabled
                      - action: input_select.select_option
                        target:
                          entity_id: input_select.solo_trip_traveler
                        data:
                          option: none
                      - variables:
                          household_away_response: "{{ final_end_terminal_response }}"
                      - stop: Solo Trip ended
                        response_variable: household_away_response

              - variables:
                  household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision, 'state': journal_phase, 'error_code': none, 'retryable': false, 'confirmed_effects': []} }}"
              - stop: Reconcile found no work
                response_variable: household_away_response

          - conditions: "{{ normalized_operation == 'resolve_restore' }}"
            sequence:
              - choose:
                  - conditions: "{{ journal_phase != 'restore_required' }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='restore_not_required') }}"
                      - stop: Restore not required
                        response_variable: household_away_response
                  - conditions: "{{ normalized_resolve_action not in ['keep_current', 'restore_saved'] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='unknown_resolve_action') }}"
                      - stop: Unknown restore action
                        response_variable: household_away_response
              - variables:
                  resolve_release_token: "{{ 'release-v1-r' ~ (current_revision + 1) }}"
                  resolve_pending_response: >-
                    {{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision + 1, 'state': 'restore_required', 'error_code': 'status_echo_timeout', 'retryable': true, 'confirmed_effects': []} }}
                  resolve_pending_request: >-
                    {% from 'solo_trip.jinja' import pending_request_record %}
                    {{ pending_request_record(normalized_request_id, request_hash_value, 'resolve_restore', current_revision + 1, resolve_release_token, 'restore_required', resolve_pending_response) }}
                  resolve_admission_journal_payload: >-
                    {% from 'solo_trip.jinja' import signed_journal %}
                    {{ signed_journal({
                      'schema_version': 1,
                      'canonicalization_version': 1,
                      'generation': current_generation + 1,
                      'revision': current_revision + 1,
                      'solo_phase': 'restore_required',
                      'writer_owner': journal_owner,
                      'release_token': resolve_release_token,
                      'runtime_plan': journal_plan,
                      'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                      'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                      'last_confirmed_overlay_fingerprint': current_journal.get('last_confirmed_overlay_fingerprint'),
                      'wake_source_ref': current_journal.get('wake_source_ref'),
                      'wake_owner_ref': current_journal.get('wake_owner_ref'),
                      'wake_prior_state': current_journal.get('wake_prior_state'),
                      'presence_evidence': presence_evidence,
                      'pending_request': resolve_pending_request | from_json,
                      'restore_record': journal_restore_record,
                      'request_results': journal_request_results
                    }) }}
                  resolve_schedule_payload: >-
                    {% from 'solo_trip.jinja' import restored_schedule %}
                    {% if normalized_resolve_action == 'restore_saved' %}
                      {{ restored_schedule(current_schedule_payload, current_journal.get('sleepypod_baseline', {}), away_side) }}
                    {% else %}
                      {{ current_schedule_payload | to_json(sort_keys=true) }}
                    {% endif %}
                  resolve_schedule_map: >-
                    {{ resolve_schedule_payload
                       if resolve_schedule_payload is mapping
                       else resolve_schedule_payload | from_json }}
                  resolve_schedule_json: >-
                    {{ resolve_schedule_payload | to_json(sort_keys=true)
                       if resolve_schedule_payload is mapping
                       else resolve_schedule_payload }}
                  resolve_full_schedule_fingerprint: >-
                    {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                    {{ full_schedule_fingerprint(resolve_schedule_map) }}
                  resolve_terminal_response: >-
                    {{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision + 1, 'state': 'idle', 'error_code': none, 'retryable': false, 'confirmed_effects': ['wake_light_source', 'writer_released'] + (['sleepypod_schedule'] if normalized_resolve_action == 'restore_saved' else [])} }}
                  resolve_terminal_request_results: >-
                    {% from 'solo_trip.jinja' import append_terminal_result %}
                    {{ append_terminal_result(journal_request_results, normalized_request_id, request_hash_value, resolve_terminal_response) }}
                  resolve_terminal_journal_payload: >-
                    {% from 'solo_trip.jinja' import signed_journal %}
                    {{ signed_journal({
                      'schema_version': 1,
                      'canonicalization_version': 1,
                      'generation': current_generation + 2,
                      'revision': current_revision + 1,
                      'solo_phase': 'idle',
                      'writer_owner': none,
                      'release_token': resolve_release_token,
                      'runtime_plan': none,
                      'sleepypod_baseline': none,
                      'baseline_fingerprint': none,
                      'last_confirmed_overlay_fingerprint': none,
                      'wake_source_ref': none,
                      'wake_owner_ref': none,
                      'wake_prior_state': none,
                      'presence_evidence': {},
                      'pending_request': none,
                      'restore_record': none,
                      'request_results': resolve_terminal_request_results | from_json
                    }) }}
                  resolve_status_payload: >-
                    {{ {'contract_version': 1, 'revision': current_revision + 1, 'command_available': true, 'mode': 'none', 'traveler': 'none', 'home_resident': 'none', 'starts_at': none, 'ends_at': none, 'blockers': [], 'effects': {'sleepypod_live_follow': false, 'sleepypod_schedule': false, 'wake_light_source': false}, 'restore_required': false, 'release_token': resolve_release_token, 'state': 'idle'} | to_json(sort_keys=true) }}
              - action: mqtt.publish
                data:
                  topic: "{{ solo_topic_journal }}"
                  payload: "{{ resolve_admission_journal_payload }}"
                  qos: 1
                  retain: true
              - wait_template: >-
                  {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (resolve_admission_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (resolve_admission_journal_payload | from_json).payload_checksum }}
                timeout: "00:00:10"
                continue_on_timeout: true
              - choose:
                  - conditions: "{{ not wait.completed }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(resolve_pending_response, error_code='journal_echo_timeout') }}"
                      - stop: Resolve admission journal echo timed out
                        response_variable: household_away_response
              - choose:
                  - conditions: "{{ normalized_resolve_action == 'restore_saved' }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "{{ sleepypod_topic_schedule }}"
                          payload: "{{ resolve_schedule_json }}"
                          qos: 1
                          retain: false
                      - wait_template: >-
                          {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                          {{ full_schedule_fingerprint({
                            'left': state_attr(sleepypod_schedule_entity_id, 'left') | default({}, true),
                            'right': state_attr(sleepypod_schedule_entity_id, 'right') | default({}, true)
                          }) == resolve_full_schedule_fingerprint }}
                        timeout: "00:02:00"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(resolve_pending_response, error_code='schedule_echo_timeout') }}"
                              - stop: Restore schedule echo timed out
                                response_variable: household_away_response
              - action: wake_light.command
                data:
                  profile_id: "{{ wake_light_profile_id }}"
                  expected_revision: "{{ wake_current_revision }}"
                  request_id: "{{ normalized_request_id }}"
                  operation: set_source_suspension
                  source_ref: "{{ current_journal.get('wake_source_ref') }}"
                  suspended: false
                  owner_ref: "{{ current_journal.get('wake_owner_ref') }}"
                response_variable: wake_light_response
              - choose:
                  - conditions: "{{ wake_light_response.outcome not in ['accepted', 'no_change'] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(resolve_pending_response, error_code='wake_light_rejected', retryable=false) }}"
                      - stop: Wake Light release rejected
                        response_variable: household_away_response
              - action: mqtt.publish
                data:
                  topic: "{{ solo_topic_journal }}"
                  payload: "{{ resolve_terminal_journal_payload }}"
                  qos: 1
                  retain: true
              - wait_template: >-
                  {{ state_attr('sensor.solo_trip_journal', 'generation') | int(-1) == (resolve_terminal_journal_payload | from_json).generation and state_attr('sensor.solo_trip_journal', 'payload_checksum') == (resolve_terminal_journal_payload | from_json).payload_checksum }}
                timeout: "00:00:10"
                continue_on_timeout: true
              - choose:
                  - conditions: "{{ not wait.completed }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(resolve_pending_response, error_code='terminal_journal_echo_timeout') }}"
                      - stop: Resolve terminal journal echo timed out
                        response_variable: household_away_response
              - action: mqtt.publish
                data:
                  topic: "{{ solo_topic_status }}"
                  payload: "{{ resolve_status_payload }}"
                  qos: 1
                  retain: true
              - wait_template: >-
                  {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (resolve_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (resolve_status_payload | from_json).release_token and states('sensor.household_away_status') == 'idle' }}
                timeout: "00:00:10"
                continue_on_timeout: true
              - choose:
                  - conditions: "{{ not wait.completed }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ resolve_pending_response }}"
                      - stop: Resolve status echo timed out
                        response_variable: household_away_response
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.solo_trip_enabled
              - action: input_select.select_option
                target:
                  entity_id: input_select.solo_trip_traveler
                data:
                  option: none
              - variables:
                  household_away_response: "{{ resolve_terminal_response }}"
              - stop: Restore resolved
                response_variable: household_away_response

          - conditions: "{{ normalized_operation == 'sleepypod_command' }}"
            sequence:
              - choose:
                  - conditions: "{{ normalized_sleepypod_action not in supported_sleepypod_actions }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='unknown_sleepypod_action') }}"
                      - stop: Unknown SleepyPod action
                        response_variable: household_away_response
                  - conditions: >-
                      {{ normalized_side not in ['left', 'right']
                         and not (
                           internal_sleepypod_bypass
                           and normalized_sleepypod_action == 'set_schedule'
                           and schedule is mapping
                         ) }}
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='invalid_side') }}"
                      - stop: Invalid side
                        response_variable: household_away_response
                  - conditions: "{{ journal_phase in ['activating', 'ending', 'restore_required', 'degraded'] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='sleepypod_locked') }}"
                      - stop: SleepyPod is locked
                        response_variable: household_away_response
                  - conditions: "{{ journal_phase == 'active' and normalized_side == away_side and not internal_sleepypod_bypass }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='traveler_side_read_only') }}"
                      - stop: Traveler side is read only
                        response_variable: household_away_response
                  - conditions: "{{ normalized_sleepypod_action == 'set_power' and enabled not in [true, false] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='missing_enabled') }}"
                      - stop: Missing power value
                        response_variable: household_away_response
                  - conditions: >-
                      {{ normalized_sleepypod_action in ['set_outside_level', 'set_tonight_level', 'set_stage_level']
                         and (
                           level is not number
                           or level | float(-100) < -10
                           or level | float(100) > 10
                         ) }}
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='invalid_level') }}"
                      - stop: Invalid level
                        response_variable: household_away_response
                  - conditions: >-
                      {{ normalized_sleepypod_action == 'set_tonight_level'
                         and sleepypod_phase_state not in ['bedtime', 'asleep', 'dawn'] }}
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='wrong_schedule_phase') }}"
                      - stop: Tonight temperature requires an active schedule phase
                        response_variable: household_away_response
                  - conditions: >-
                      {{ normalized_sleepypod_action == 'set_outside_level'
                         and sleepypod_phase_state != 'outside' }}
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='wrong_schedule_phase') }}"
                      - stop: Outside temperature requires the outside schedule phase
                        response_variable: household_away_response
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and phase not in ['bedtime', 'asleep', 'dawn'] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='invalid_phase') }}"
                      - stop: Invalid phase
                        response_variable: household_away_response
                  - conditions: "{{ normalized_sleepypod_action == 'set_schedule' and schedule is not mapping }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='schedule_unavailable') }}"
                      - stop: Schedule payload required
                        response_variable: household_away_response
                  - conditions: "{{ normalized_sleepypod_action == 'replace_alarms' and alarm_rows is not iterable }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='missing_alarm_rows') }}"
                      - stop: Alarm rows required
                        response_variable: household_away_response
                  - conditions: >-
                      {% set rows = alarm_rows | list if alarm_rows is iterable and alarm_rows is not string else [] %}
                      {{ normalized_sleepypod_action == 'replace_alarms'
                         and (
                           rows | selectattr('day', 'defined') | list | count != rows | count
                           or rows | selectattr('day', 'in', ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday']) | list | count != rows | count
                           or rows | selectattr('alarmTemperature', 'defined') | list | count != rows | count
                           or rows | selectattr('duration', 'defined') | list | count != rows | count
                           or rows | selectattr('enabled', 'defined') | list | count != rows | count
                           or rows | selectattr('time', 'defined') | list | count != rows | count
                           or rows | selectattr('vibrationIntensity', 'defined') | list | count != rows | count
                           or rows | selectattr('vibrationPattern', 'defined') | list | count != rows | count
                         ) }}
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='invalid_alarm_rows') }}"
                      - stop: Invalid alarm rows
                        response_variable: household_away_response
              - variables:
                  sleepypod_effective_side: "{{ home_side if journal_phase == 'active' else normalized_side }}"
                  sleepypod_schedule_payload: >-
                    {% from 'solo_trip.jinja' import merged_schedule, replaced_alarms %}
                    {% if normalized_sleepypod_action == 'set_schedule' %}
                      {{ merged_schedule(current_schedule_payload, schedule if schedule is mapping else {}, sleepypod_effective_side, journal_phase == 'active', home_side, away_side) }}
                    {% elif normalized_sleepypod_action == 'replace_alarms' %}
                      {{ replaced_alarms(current_schedule_payload, sleepypod_effective_side, alarm_rows if alarm_rows is iterable else [], journal_phase == 'active', home_side, away_side) }}
                    {% else %}
                      {{ none }}
                    {% endif %}
                  sleepypod_schedule_map: >-
                    {% if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] %}
                      {{ sleepypod_schedule_payload
                         if sleepypod_schedule_payload is mapping
                         else sleepypod_schedule_payload | from_json }}
                    {% else %}
                      {{ none }}
                    {% endif %}
                  sleepypod_schedule_json: >-
                    {% if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] %}
                      {{ sleepypod_schedule_payload | to_json(sort_keys=true)
                         if sleepypod_schedule_payload is mapping
                         else sleepypod_schedule_payload }}
                    {% else %}
                      {{ none }}
                    {% endif %}
                  sleepypod_away_fingerprint: >-
                    {% from 'solo_trip.jinja' import side_fingerprint %}
                    {{ side_fingerprint(sleepypod_schedule_map[away_side])
                       if normalized_sleepypod_action in ['set_schedule', 'replace_alarms']
                       else none }}
                  sleepypod_full_schedule_fingerprint: >-
                    {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                    {{ full_schedule_fingerprint(sleepypod_schedule_map)
                       if normalized_sleepypod_action in ['set_schedule', 'replace_alarms']
                       else none }}
                  sleepypod_terminal_response: >-
                    {{ {'request_id': normalized_request_id, 'status': 'accepted', 'revision': current_revision + (1 if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] and not internal_sleepypod_bypass else 0), 'state': journal_phase, 'error_code': none, 'retryable': false, 'confirmed_effects': ['sleepypod_schedule'] if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] else []} }}
                  sleepypod_terminal_request_results: >-
                    {% from 'solo_trip.jinja' import append_terminal_result %}
                    {{ append_terminal_result(journal_request_results, normalized_request_id, request_hash_value, sleepypod_terminal_response) }}
                  sleepypod_terminal_journal_payload: >-
                    {% from 'solo_trip.jinja' import signed_journal %}
                    {{ signed_journal({
                      'schema_version': 1,
                      'canonicalization_version': 1,
                      'generation': current_generation + (1 if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] else 0),
                      'revision': current_revision + (1 if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] and not internal_sleepypod_bypass else 0),
                      'solo_phase': journal_phase,
                      'writer_owner': journal_owner,
                      'release_token': current_release_token,
                      'runtime_plan': journal_plan,
                      'sleepypod_baseline': current_journal.get('sleepypod_baseline'),
                      'baseline_fingerprint': current_journal.get('baseline_fingerprint'),
                      'last_confirmed_overlay_fingerprint': sleepypod_away_fingerprint if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] and journal_phase == 'active' else current_journal.get('last_confirmed_overlay_fingerprint'),
                      'wake_source_ref': current_journal.get('wake_source_ref'),
                      'wake_owner_ref': current_journal.get('wake_owner_ref'),
                      'wake_prior_state': current_journal.get('wake_prior_state'),
                      'presence_evidence': presence_evidence,
                      'pending_request': none,
                      'restore_record': none,
                      'request_results': sleepypod_terminal_request_results | from_json if not internal_sleepypod_bypass else journal_request_results
                    }) }}
                  sleepypod_status_payload: >-
                    {{ {'contract_version': 1, 'revision': current_revision + (1 if normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] and not internal_sleepypod_bypass else 0), 'command_available': true, 'mode': 'solo_trip' if journal_plan is mapping else 'none', 'traveler': selected_traveler if journal_plan is mapping else 'none', 'home_resident': home_resident if journal_plan is mapping else 'none', 'starts_at': journal_plan.starts_at if journal_plan is mapping else none, 'ends_at': journal_plan.ends_at if journal_plan is mapping else none, 'blockers': [], 'effects': current_public_status.get('effects', {}), 'restore_required': false, 'release_token': current_release_token, 'state': journal_phase} | to_json(sort_keys=true) }}
              - choose:
                  - conditions: "{{ normalized_sleepypod_action == 'set_power' and journal_phase == 'active' and not internal_sleepypod_bypass }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        target:
                          entity_id:
                            - climate.sleepypod_eight_pod_left_side
                            - climate.sleepypod_eight_pod_right_side
                        data:
                          hvac_mode: "{{ 'heat' if enabled else 'off' }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_power' and normalized_side == 'left' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        target:
                          entity_id: climate.sleepypod_eight_pod_left_side
                        data:
                          hvac_mode: "{{ 'heat' if enabled else 'off' }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_power' and normalized_side == 'right' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        target:
                          entity_id: climate.sleepypod_eight_pod_right_side
                        data:
                          hvac_mode: "{{ 'heat' if enabled else 'off' }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_tonight_level' and journal_phase == 'active' and not internal_sleepypod_bypass and selected_traveler == 'stephen' }}"
                    sequence:
                      - action: script.sleepypod_steph_temperature_tonight
                        data:
                          level: "{{ level }}"
                      - action: script.sleepypod_stephen_temperature_tonight
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_tonight_level' and journal_phase == 'active' and not internal_sleepypod_bypass and selected_traveler == 'steph' }}"
                    sequence:
                      - action: script.sleepypod_stephen_temperature_tonight
                        data:
                          level: "{{ level }}"
                      - action: script.sleepypod_steph_temperature_tonight
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_tonight_level' and normalized_side == 'left' }}"
                    sequence:
                      - action: script.sleepypod_stephen_temperature_tonight
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_tonight_level' and normalized_side == 'right' }}"
                    sequence:
                      - action: script.sleepypod_steph_temperature_tonight
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_outside_level' and journal_phase == 'active' and not internal_sleepypod_bypass and selected_traveler == 'stephen' }}"
                    sequence:
                      - action: script.sleepypod_steph_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                      - action: script.sleepypod_stephen_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_outside_level' and journal_phase == 'active' and not internal_sleepypod_bypass and selected_traveler == 'steph' }}"
                    sequence:
                      - action: script.sleepypod_stephen_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                      - action: script.sleepypod_steph_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_outside_level' and normalized_side == 'left' }}"
                    sequence:
                      - action: script.sleepypod_stephen_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_outside_level' and normalized_side == 'right' }}"
                    sequence:
                      - action: script.sleepypod_steph_temperature_outside_schedule
                        data:
                          level: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and journal_phase == 'active' and not internal_sleepypod_bypass and phase == 'bedtime' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id:
                            - input_number.eight_sleep_stephen_bedtime_level
                            - input_number.eight_sleep_steph_bedtime_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and journal_phase == 'active' and not internal_sleepypod_bypass and phase == 'asleep' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id:
                            - input_number.eight_sleep_stephen_asleep_level
                            - input_number.eight_sleep_steph_asleep_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and journal_phase == 'active' and not internal_sleepypod_bypass and phase == 'dawn' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id:
                            - input_number.eight_sleep_stephen_dawn_level
                            - input_number.eight_sleep_steph_dawn_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'left' and phase == 'bedtime' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_stephen_bedtime_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'left' and phase == 'asleep' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_stephen_asleep_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'left' and phase == 'dawn' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_stephen_dawn_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'right' and phase == 'bedtime' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_steph_bedtime_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'right' and phase == 'asleep' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_steph_asleep_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'set_stage_level' and normalized_side == 'right' and phase == 'dawn' }}"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.eight_sleep_steph_dawn_level
                        data:
                          value: "{{ level }}"
                  - conditions: "{{ normalized_sleepypod_action == 'snooze_alarm' and journal_phase == 'active' and not internal_sleepypod_bypass }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id:
                            - "{{ selected_profile.home_alarm_snooze }}"
                            - "{{ selected_profile.away_alarm_snooze }}"
                  - conditions: "{{ normalized_sleepypod_action == 'snooze_alarm' and normalized_side == 'left' }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id: button.master_bedroom_sleepypod_eight_pod_left_alarm_snooze
                  - conditions: "{{ normalized_sleepypod_action == 'snooze_alarm' and normalized_side == 'right' }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id: button.master_bedroom_sleepypod_eight_pod_right_alarm_snooze
                  - conditions: "{{ normalized_sleepypod_action == 'stop_alarm' and journal_phase == 'active' and not internal_sleepypod_bypass }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id:
                            - "{{ selected_profile.home_alarm_stop }}"
                            - "{{ selected_profile.away_alarm_stop }}"
                  - conditions: "{{ normalized_sleepypod_action == 'stop_alarm' and normalized_side == 'left' }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id: button.master_bedroom_sleepypod_eight_pod_left_alarm_stop
                  - conditions: "{{ normalized_sleepypod_action == 'stop_alarm' and normalized_side == 'right' }}"
                    sequence:
                      - action: button.press
                        target:
                          entity_id: button.master_bedroom_sleepypod_eight_pod_right_alarm_stop
              - choose:
                  - conditions: "{{ normalized_sleepypod_action in ['set_schedule', 'replace_alarms'] }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "{{ sleepypod_topic_schedule }}"
                          payload: "{{ sleepypod_schedule_json }}"
                          qos: 1
                          retain: false
                      - wait_template: >-
                          {% from 'solo_trip.jinja' import full_schedule_fingerprint %}
                          {{ full_schedule_fingerprint({
                            'left': state_attr(sleepypod_schedule_entity_id, 'left') | default({}, true),
                            'right': state_attr(sleepypod_schedule_entity_id, 'right') | default({}, true)
                          }) == sleepypod_full_schedule_fingerprint }}
                        timeout: "00:02:00"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(default_response, error_code='schedule_echo_timeout', status='indeterminate', state=journal_phase, retryable=true) }}"
                              - stop: Active schedule echo timed out
                                response_variable: household_away_response
                      - choose:
                          - conditions: "{{ not internal_sleepypod_bypass or journal_phase == 'active' }}"
                            sequence:
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_journal }}"
                                  payload: "{{ sleepypod_terminal_journal_payload }}"
                                  qos: 1
                                  retain: true
                              - wait_template: >-
                                  {{ state_attr('sensor.solo_trip_journal', 'payload_checksum') == (sleepypod_terminal_journal_payload | from_json).payload_checksum }}
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - choose:
                                  - conditions: "{{ not wait.completed }}"
                                    sequence:
                                      - variables:
                                          household_away_response: "{{ dict(default_response, error_code='terminal_journal_echo_timeout', status='indeterminate', state=journal_phase, retryable=true) }}"
                                      - stop: SleepyPod terminal journal echo timed out
                                        response_variable: household_away_response
                              - action: mqtt.publish
                                data:
                                  topic: "{{ solo_topic_status }}"
                                  payload: "{{ sleepypod_status_payload }}"
                                  qos: 1
                                  retain: true
                              - wait_template: >-
                                  {{ state_attr('sensor.household_away_status', 'revision') | int(-1) == (sleepypod_status_payload | from_json).revision and state_attr('sensor.household_away_status', 'release_token') == (sleepypod_status_payload | from_json).release_token and states('sensor.household_away_status') == journal_phase }}
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - choose:
                                  - conditions: "{{ not wait.completed }}"
                                    sequence:
                                      - variables:
                                          household_away_response: "{{ dict(default_response, error_code='status_echo_timeout', status='indeterminate', state=journal_phase, retryable=true) }}"
                                      - stop: SleepyPod status echo timed out
                                        response_variable: household_away_response
                  - conditions: "{{ normalized_sleepypod_action not in ['set_schedule', 'replace_alarms'] and not internal_sleepypod_bypass }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: "{{ solo_topic_journal }}"
                          payload: "{{ sleepypod_terminal_journal_payload }}"
                          qos: 1
                          retain: true
                      - wait_template: >-
                          {{ state_attr('sensor.solo_trip_journal', 'payload_checksum') == (sleepypod_terminal_journal_payload | from_json).payload_checksum }}
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - choose:
                          - conditions: "{{ not wait.completed }}"
                            sequence:
                              - variables:
                                  household_away_response: "{{ dict(default_response, error_code='terminal_journal_echo_timeout', status='indeterminate', state=journal_phase, retryable=true) }}"
                              - stop: SleepyPod journal echo timed out
                                response_variable: household_away_response
              - variables:
                  household_away_response: "{{ sleepypod_terminal_response }}"
              - stop: SleepyPod command dispatched
                response_variable: household_away_response

          - conditions: "{{ normalized_operation == 'end_now' }}"
            sequence:
              - choose:
                  - conditions: "{{ journal_phase not in ['active', 'restore_required'] }}"
                    sequence:
                      - variables:
                          household_away_response: "{{ dict(default_response, error_code='solo_trip_not_active') }}"
                      - stop: Solo Trip is not active
                        response_variable: household_away_response
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.solo_trip_enabled
              - variables:
                  household_away_response: "{{ {'request_id': normalized_request_id, 'status': 'indeterminate', 'revision': current_revision, 'state': 'ending', 'error_code': 'ending_requested', 'retryable': true, 'confirmed_effects': []} }}"
              - stop: Solo Trip ending requested
                response_variable: household_away_response

automation:
  - id: solo_trip_reconcile
    alias: Solo Trip reconcile
    mode: queued
    max: 10
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/1"
        id: watchdog
      - trigger: state
        entity_id:
          - input_boolean.solo_trip_enabled
          - input_select.solo_trip_traveler
          - input_datetime.solo_trip_start
          - input_datetime.solo_trip_end
          - input_boolean.vacation_mode
        id: intent
      - trigger: state
        entity_id:
          - sensor.solo_trip_journal
          - sensor.household_away_status
        id: lifecycle
      - trigger: state
        entity_id:
          - sensor.master_bedroom_sleepypod_eight_pod_schedules
          - sensor.master_bedroom_sleepypod_eight_pod_left_alarm_state
          - sensor.master_bedroom_sleepypod_eight_pod_right_alarm_state
          - person.stephen_fenton
          - person.stephanie_hobart
        id: engaged_device
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id != 'engaged_device'
             or state_attr('sensor.solo_trip_journal', 'solo_phase')
               in ['activating', 'active', 'degraded', 'ending', 'restore_required'] }}
    actions:
      - action: script.household_away_command
        data:
          operation: reconcile
          request_id: >-
            reconcile-{{ trigger.id | default('unknown', true) }}-{{ trigger.entity_id | default('state', true) | replace('.', '-') }}-{{ trigger.to_state.context.id if trigger.to_state is defined and trigger.to_state is not none else 'no-context' }}-{{ now().strftime('%Y%m%d%H%M%S%f') }}
          expected_revision: >-
            {{ state_attr('sensor.solo_trip_journal', 'revision') | int(0) }}
          reason: >-
            {{ trigger.entity_id | default(trigger.platform, true) }}
