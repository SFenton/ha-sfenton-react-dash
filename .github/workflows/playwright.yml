name: Playwright

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require changed tests for implementation changes
        if: github.event_name == 'pull_request'
        run: npm run test:change-policy -- --base ${{ github.event.pull_request.base.sha }}
      - name: Run lint, unit, contract, and production-build checks
        run: npm run check:ci

  layout:
    name: Automated layout
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve comparison base
        id: base
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PULL_REQUEST_BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Plan affected layout evidence
        run: npm run layout:plan -- --base "${{ steps.base.outputs.sha }}" --out artifacts/layout/ci/plan.json
      - name: Read layout classification
        id: classification
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const plan = JSON.parse(fs.readFileSync('artifacts/layout/ci/plan.json', 'utf8')); const browsers = plan.mode === 'tooling' ? 'chromium' : 'chromium webkit'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'required=' + (plan.mode !== 'non-layout') + '\nbrowsers=' + browsers + '\n')"
      - name: Install layout browsers
        if: steps.classification.outputs.required == 'true'
        env:
          LAYOUT_BROWSERS: ${{ steps.classification.outputs.browsers }}
        run: npx playwright install --with-deps $LAYOUT_BROWSERS
      - name: Run automated layout evidence
        run: npm run layout:run -- --plan artifacts/layout/ci/plan.json
      - name: Verify automated layout evidence
        run: npm run layout:verify -- --run artifacts/layout/ci --automated-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-automation
          path: |
            artifacts/layout/ci
            !artifacts/layout/ci/baseline-source/node_modules
            !artifacts/layout/ci/baseline-cache
            !artifacts/layout/ci/candidate-cache
            !artifacts/layout/ci/scratch
          include-hidden-files: true
          retention-days: 14

  layout-failure:
    name: Report automated layout failure
    if: ${{ always() && needs.layout.result == 'failure' }}
    needs: layout
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create investigation issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          ISSUE_MARKER: layout-failure-commit-${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          existing_issues=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$ISSUE_MARKER in:body" \
            --json number \
            --limit 1)
          if [[ "$existing_issues" != "[]" ]]; then
            echo "An open layout failure issue already exists for $COMMIT_SHA; skipping creation."
            exit 0
          fi
          cat > "$RUNNER_TEMP/layout-failure.md" <<EOF
          <!-- $ISSUE_MARKER -->
          ## Automated layout failure

          The post-merge automated layout job failed and needs investigation.

          - Commit: \`$COMMIT_SHA\`
          - Workflow: \`$WORKFLOW_NAME\`
          - Ref: \`$REF_NAME\`
          - Run: [$RUN_URL]($RUN_URL)
          - Artifacts: [$ARTIFACT_URL]($ARTIFACT_URL)

          Review the failed **Automated layout** job logs and uploaded artifacts before closing this issue.
          EOF
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Automated layout failure on ${COMMIT_SHA:0:12}" \
            --body-file "$RUNNER_TEMP/layout-failure.md"

  build-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build mock dashboard
        run: npx vite build --mode test --configLoader native --outDir .playwright-dist
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-build
          path: .playwright-dist/
          include-hidden-files: true
          retention-days: 1

  test:
    needs: build-mock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: playwright-mock-build
          path: .playwright-dist
      - name: Run shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          CI: 1
          PLAYWRIGHT_PREBUILT_MOCK: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  report:
    name: Playwright gate
    if: always()
    needs: [quality, layout, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Enforce successful dashboard CI
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "::error::Dashboard CI did not pass (quality: $QUALITY_RESULT, layout: $LAYOUT_RESULT, Playwright: $TEST_RESULT)."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$LAYOUT_RESULT" != "success" ]]; then
            echo "::error::Post-merge dashboard CI did not pass automated layout (layout: $LAYOUT_RESULT)."
            exit 1
          fi
