name: App Manual quality

on:
  pull_request:
  push:
    branches: [master]

jobs:
  manual-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run manual:check
      - run: npm run test:manual
      - run: npm run test:e2e:manual
      - run: npm run manual:capture:check
      - run: npm run build
